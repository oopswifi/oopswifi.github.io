<script>function shortTarget(target, search, hash) {
	var cut = target.indexOf("#");
	var own = cut < 0 ? "" : target.slice(cut);
	var rest = cut < 0 ? target : target.slice(0, cut);
	var mark = rest.indexOf("?");
	var q = search.length > 1 ? search : "";
	(mark < 0 ? "" : rest.slice(mark + 1)).split("&").forEach(function(p) {
		if (p && !new RegExp("[?&]" + p.split("=")[0] + "=").test(q)) q += (q ? "&" : "?") + p;
	});
	return (mark < 0 ? rest : rest.slice(0, mark)) + q + (hash.length > 1 ? hash : own);
}
location.replace(shortTarget("../about.html#en", location.search, location.hash));</script>
