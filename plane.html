  <section id="desk">
    <h1>折一架海风纸飞机</h1>
    <p class="lead">《心跳海岸线》的海边别墅里，每天晚上可以把写着心里话的纸飞机，扔到一个人的阳台上。你也折一架，送给想送的人吧。</p>
    <h2>写一句</h2>
    <div id="notes" role="radiogroup" aria-label="写一句">
      <button type="button" role="radio" aria-checked="true" data-m="0">今晚早点睡。</button>
      <button type="button" role="radio" aria-checked="false" data-m="1">别墅的 Wi-Fi 修到满格了，但看到你还是会掉线。</button>
      <button type="button" role="radio" aria-checked="false" data-m="2">鸡腿很好吃。谢谢你。</button>
      <button type="button" role="radio" aria-checked="false" data-m="3">今天也很努力了。剩下的 bug，明天再修。</button>
      <button type="button" role="radio" aria-checked="false" data-m="4">明晚 solo，我不会让着你。</button>
      <button type="button" role="radio" aria-checked="false" data-m="5">海风很大，想到你，就折了这一架。</button>
      <button type="button" role="radio" aria-checked="false" data-m="6">信号满格，想你也满格。</button>
      <button type="button" role="radio" aria-checked="false" data-m="7">这周辛苦了。周末记得好好休息。</button>
    </div>
    <h2>署名</h2>
    <div id="signs" role="radiogroup" aria-label="署名">
      <button type="button" role="radio" aria-checked="true" data-f="0">不署名</button>
      <button type="button" role="radio" aria-checked="false" data-f="1">来自：路过的修网线技术员</button>
      <button type="button" role="radio" aria-checked="false" data-f="2">来自：恋综天台吹风的人</button>
      <button type="button" role="radio" aria-checked="false" data-f="3">来自：同一片海风里的人</button>
    </div>
    <noscript><p class="small">折纸飞机要开启 JavaScript。</p></noscript>
    <button id="fold" class="btn go" type="button">✈️ 折好了</button>
    <div id="out" class="out" hidden>
      <p>这架纸飞机的链接，发给想送的人：</p>
      <input id="link" readonly aria-label="纸飞机的链接">
      <div class="row"><button id="copy" class="btn soft" type="button" data-done="已复制">复制链接</button><a id="see" class="btn soft" href="./plane.html">看看收到的样子</a></div>
      <p class="small">链接里只有两个数字：哪一句、哪个署名。这里不能写别的字，谁也没法借它发奇怪的内容。</p>
    </div>
    <a class="btn soft" href="./?ref=plane">▶ 去《心跳海岸线》看看这架纸飞机的故事（免费试玩）</a>
  </section>
  <section id="sea" hidden>
    <p id="hint" class="hint" data-open="海风把它吹开了。">有一架纸飞机，落在了你的阳台上。点一下，打开它。</p>
    <button id="catch" class="stage" type="button" aria-expanded="false" aria-label="打开纸飞机"><svg class="plane" viewBox="0 0 120 80" aria-hidden="true"><path d="M2 40 118 4 60 76 50 50Z" fill="#fff"/><path d="M118 4 50 50 60 76Z" fill="#d6dee8"/><path d="M50 50 118 4" stroke="#b8c4d2" stroke-width="1.5"/></svg><span class="paper"><span id="msg" class="msg"></span><span id="from" class="from"></span></span></button>
    <div id="after" hidden>
      <a class="btn go" href="./?ref=plane">▶ 去《心跳海岸线》看看这架纸飞机的故事（免费试玩）</a>
      <a class="btn soft" href="./plane.html">✈️ 回折一架纸飞机</a>
    </div>
  </section>
  <footer>糟了！我只是来恋综修网线的 · 画面由 AI 生成 · 本作所有角色均为成年人，剧情纯属虚构 · <a href="./about.html">关于</a></footer>

<script>(function () {
  var NOTES = ["今晚早点睡。","别墅的 Wi-Fi 修到满格了，但看到你还是会掉线。","鸡腿很好吃。谢谢你。","今天也很努力了。剩下的 bug，明天再修。","明晚 solo，我不会让着你。","海风很大，想到你，就折了这一架。","信号满格，想你也满格。","这周辛苦了。周末记得好好休息。"];
  var SIGNS = ["","来自：路过的修网线技术员","来自：恋综天台吹风的人","来自：同一片海风里的人"];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var q = new URLSearchParams(location.search);
  var m = q.get('m');
  var f = q.get('f');
  var $ = function (id) { return document.getElementById(id); };
  if (/^[0-9]$/.test(m || '') && +m < NOTES.length) {
    var sign = /^[0-9]$/.test(f || '') && +f < SIGNS.length ? SIGNS[+f] : '';
    $('desk').hidden = true;
    $('sea').hidden = false;
    $('msg').textContent = NOTES[+m];
    $('from').textContent = sign;
    // The other script shows the same plane.
    Array.prototype.forEach.call(document.querySelectorAll('.langs a'), function (a) { a.search = location.search; });
    var stage = $('catch');
    var open = function () {
      stage.classList.add('open');
      stage.setAttribute('aria-expanded', 'true');
      $('after').hidden = false;
      $('hint').textContent = $('hint').getAttribute('data-open');
    };
    if (reduce) open();
    else {
      stage.classList.add('fly');
      stage.addEventListener('click', open);
    }
    return;
  }
  var pick = { m: 0, f: 0 };
  function group(id, key) {
    var buttons = $(id).querySelectorAll('button');
    Array.prototype.forEach.call(buttons, function (b, i) {
      b.addEventListener('click', function () {
        pick[key] = i;
        Array.prototype.forEach.call(buttons, function (x, k) { x.setAttribute('aria-checked', String(k === i)); });
        $('out').hidden = true;
      });
    });
  }
  group('notes', 'm');
  group('signs', 'f');
  $('fold').addEventListener('click', function () {
    var link = location.origin + location.pathname + '?m=' + pick.m + (pick.f ? '&f=' + pick.f : '');
    $('link').value = link;
    $('see').href = link;
    $('out').hidden = false;
    $('link').select();
  });
  $('copy').addEventListener('click', function () {
    var b = this;
    var done = function () { b.textContent = b.getAttribute('data-done'); };
    if (navigator.clipboard) navigator.clipboard.writeText($('link').value).then(done, function () { $('link').select(); });
    else { $('link').select(); done(); }
  });
})();</script>
